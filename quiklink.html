<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuikLink</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar" id="nav-placeholder"></nav>

  <script>
    // Load the shared navbar
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;

        // Attach toggle functionality AFTER navbar is injected
        const toggle = document.querySelector(".nav-toggle");
        if (toggle) {
          toggle.addEventListener("click", function () {
            document.querySelector(".navbar").classList.toggle("mobile-open");
          });
        }
      });
  </script>

  <div class="quiklink">
    <h1>QuikLink — Drop. Stack. Deploy.</h1>

    <label>Website URL</label>
    <input type="text" id="url" placeholder="https://example.com">

    <label>Icon Image URL</label>
    <input type="text" id="img" placeholder="https://example.com/icon.png">

    <label>Link Label</label>
    <input type="text" id="label" placeholder="Example">

    <button onclick="addLink()"> + Add Another Link + </button>

    <div id="preview"></div>

    <button onclick="generateBatch()">Generate Snippet</button>

    <h2>Output <span id="reminder" style="color: #2ecc71; margin-left: 15px; font-size: 1rem; font-weight: normal;"></span></h2>
    <div class="output" id="output">WAITING FOR SNIPPET..</div>

    <button onclick="copyToClipboard()">Copy Snippet</button>
    
    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">

    <button onclick="clearEverything()" style="background-color: #e74c3c; color: white;">Clear All & Reset</button>
  </div>

  <script>
    function addLink() {
      const urlInput = document.getElementById("url");
      const imgInput = document.getElementById("img");
      const labelInput = document.getElementById("label");

      const url = urlInput.value;
      const img = imgInput.value;
      const label = labelInput.value;

      // Prevent adding completely blank entries
      if (!url && !label) return;

      const preview = document.getElementById("preview");
      const div = document.createElement("div");
      div.className = "link-preview";

      div.innerHTML = `
        <a class="item" href="${url}" target="_blank">
          <img src="${img}" alt="${label}">
          <span>${label}</span>
        </a>
      `;

      preview.appendChild(div);

      // 1. Clear the inputs so you don't accidentally double-add
      urlInput.value = "";
      imgInput.value = "";
      labelInput.value = "";
    }

    function generateBatch() {
      const previews = document.querySelectorAll(".link-preview");
      let snippet = "";
      previews.forEach(p => {
        snippet += p.innerHTML.trim() + "\n";
      });
      document.getElementById("output").textContent = snippet || "NO LINKS ADDED YET";
    }

    function copyToClipboard() {
      const output = document.getElementById("output").textContent;
      navigator.clipboard.writeText(output).then(() => {
        // 2. Displays green success text right next to Output header
        document.getElementById("reminder").textContent = "✔ Copied to clipboard!";
      });
    }

    // 3. New function to clear everything and start fresh
    function clearEverything() {
      // Clear inputs
      document.getElementById("url").value = "";
      document.getElementById("img").value = "";
      document.getElementById("label").value = "";
      
      // Clear the live preview container
      document.getElementById("preview").innerHTML = "";
      
      // Reset output box and reminder text
      document.getElementById("output").textContent = "WAITING FOR SNIPPET..";
      document.getElementById("reminder").textContent = "";
    }
  </script>

</body>
</html>
